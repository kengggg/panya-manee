# Create a PR that publishes a snapshot to the dashboard.
#
# SELF-HOSTED RUNNER REQUIRED
#   benchmark_responses/ is gitignored — data lives only on the runner.
#   This workflow reads batch data produced by a prior benchmark-run.yml execution.
#
# Safety model:
#   - workflow_dispatch only — never triggered by PRs or pushes
#   - Always checks out the trusted main branch
#   - Concurrency lock prevents parallel snapshot publications
#
# What it does:
#   0. Refuses plain hobby/test batches — requires a passing publication verification
#      verification report from the verified-only publication pipeline
#   1. Builds snapshot bundle from batch data (build_snapshot.py)
#   2. Validates cross-file consistency (validate_snapshot.py)
#   3. Syncs dashboard data to site/data/latest/
#   4. Updates registry/snapshots.json and registry/current-manifest.json
#   5. Commits durable dist/ snapshot bundles referenced by the current manifest
#   6. Opens a PR with the changes
#
# After the PR is merged, pages-deploy.yml deploys the dashboard automatically.

name: Snapshot PR

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch ID to publish (e.g. mini-r10-20260409)'
        required: true
        type: string
      source_run_id:
        description: 'Workflow run ID that produced the batch artifact bundle'
        required: true
        type: string
      snapshot_id:
        description: 'Override snapshot ID (default: nt-p3-mcq-text-only-{batch_id})'
        required: false
        default: ''
        type: string
      update_current_manifest:
        description: 'Append/update this snapshot in registry/current-manifest.json and rebuild current.json from it'
        required: false
        default: true
        type: boolean
      current_id:
        description: 'Override registry/current-manifest.json current_id (optional)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — build + validate only, no PR'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: snapshot-pr
  cancel-in-progress: false

jobs:
  publish:
    # SELF-HOSTED: needs benchmark_responses/ from prior benchmark runs.
    runs-on: [self-hosted, macOS, ARM64, panya-manee-baseline]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare Python and uv
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /opt/homebrew/bin/python3 --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch verified batch artifact bundle
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.source_run_id }}
          BATCH_ID: ${{ inputs.batch_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/ci/fetch_batch_artifact.py \
            --repo "$REPO" \
            --run-id "$RUN_ID" \
            --artifact-name "benchmark-verified-${BATCH_ID}" \
            --batch-id "$BATCH_ID"

      - name: Verify benchmark data exists
        env:
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          # Check for repeat_summary (preferred) or raw JSONL files (fallback)
          SUMMARY="benchmark_responses/repeat_summary_${BATCH_ID}.json"
          if [ -f "$SUMMARY" ]; then
            echo "Found repeat_summary: $SUMMARY"
            SUMMARY="$SUMMARY" uv run python scripts/ci/render_batch_verify.py 2>/dev/null || echo "::warning::Could not parse repeat_summary"
          else
            echo "::warning::No repeat_summary at $SUMMARY — build_snapshot will fall back to glob"
          fi

          COUNT=$(ls -1 benchmark_responses/responses_"${BATCH_ID}"-*.jsonl 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No response files found for batch '${BATCH_ID}'"
            echo "Run benchmark-run.yml first, then retry."
            ls -la benchmark_responses/ 2>/dev/null | head -20 || echo "(directory missing)"
            exit 1
          fi
          echo "Found $COUNT response file(s) for batch '${BATCH_ID}'"

      - name: Build and publish snapshot
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          UPDATE_CURRENT_MANIFEST: ${{ inputs.update_current_manifest }}
          CURRENT_ID: ${{ inputs.current_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          SNAP_ARG=""
          if [ -n "$SNAPSHOT_ID" ]; then
            SNAP_ARG="--snapshot-id $SNAPSHOT_ID"
          fi
          CURRENT_ARG=""
          if [ -n "$CURRENT_ID" ]; then
            CURRENT_ARG="--current-id $CURRENT_ID"
          fi
          MANIFEST_ARG="--update-current-manifest"
          if [ "$UPDATE_CURRENT_MANIFEST" != "true" ]; then
            MANIFEST_ARG="--no-update-current-manifest"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            uv run python scripts/publish_snapshot.py --batch-id "$BATCH_ID" $SNAP_ARG $MANIFEST_ARG $CURRENT_ARG --dry-run
          else
            uv run python scripts/publish_snapshot.py --batch-id "$BATCH_ID" $SNAP_ARG $MANIFEST_ARG $CURRENT_ARG
          fi

      - name: Create PR
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_ID: ${{ inputs.batch_id }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          UPDATE_CURRENT_MANIFEST: ${{ inputs.update_current_manifest }}
          CURRENT_ID: ${{ inputs.current_id }}
        run: |
          # Resolve snapshot ID
          SID="${SNAPSHOT_ID:-nt-p3-mcq-text-only-${BATCH_ID}}"
          BRANCH="snapshot/${SID}"

          # Stage site data, registries, and durable snapshot bundles. dist/ is
          # ignored for local build hygiene, so force-add the exact published
          # snapshot directory/zip referenced by registry/current-manifest.json.
          git add site/data/ registry/
          git add -f "dist/${SID}"
          if [ -f "dist/${SID}.zip" ]; then
            git add -f "dist/${SID}.zip"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit — snapshot data already matches main."
            exit 0
          fi

          # Configure git for the bot commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Refresh remote-tracking refs on self-hosted runners so force-with-lease
          # does not fail against branches that were deleted after merge.
          git fetch origin --prune

          # Create branch (reset if it exists from a prior failed run)
          git checkout -B "$BRANCH"
          git commit -m "Publish snapshot ${SID}"

          # Push safely when a remote branch exists, or create it cleanly when it doesn't.
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git push -u origin "$BRANCH" --force-with-lease
          else
            git push -u origin "$BRANCH"
          fi

          # Build PR body
          PR_BODY="## Snapshot Publication

          **Batch ID**: \`${BATCH_ID}\`
          **Source**: benchmark data on self-hosted runner
          **Current manifest update**: \`${UPDATE_CURRENT_MANIFEST}\`
          **Current ID**: \`${CURRENT_ID:-'(unchanged/default)'}\`

          ### What changed
          - \`site/data/latest/\` updated snapshot bundle plus canonical \`current.json\`
          - \`registry/snapshots.json\` updated snapshot index
          - \`registry/current-manifest.json\` appended/updated when manifest publishing is enabled
          - \`dist/${SID}/\` and \`dist/${SID}.zip\` committed so manifest-driven current rebuilds are durable

          ### Current manifest behavior
          The dashboard loads one canonical \`site/data/latest/current.json\`. When manifest publishing is enabled, it is rebuilt from ordered \`registry/current-manifest.json\` sources; later snapshots replace earlier rows with the same \`model_id\`.

          ### Validation
          Snapshot passed all cross-file consistency checks via \`validate_snapshot.py\`.

          ### After merge
          \`pages-deploy.yml\` will deploy the updated dashboard to GitHub Pages automatically."

          # Open PR
          PR_URL=$(gh pr create \
            --title "Publish snapshot: ${SID}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            echo "::warning::PR creation failed — a PR for this branch may already exist"
          fi
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr list \
              --head "$BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url' 2>/dev/null || true)
          fi
          if [ -n "$PR_URL" ]; then
            echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
            echo "Opened PR: $PR_URL"
          else
            echo "::error::Could not create or resolve PR URL for branch '$BRANCH'"
            exit 1
          fi

      - name: Job summary
        if: always()
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          UPDATE_CURRENT_MANIFEST: ${{ inputs.update_current_manifest }}
          CURRENT_ID: ${{ inputs.current_id }}
        run: |
          SID="${SNAPSHOT_ID:-nt-p3-mcq-text-only-${BATCH_ID}}"
          {
            echo "## Snapshot: \`${SID}\`"
            echo ""
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| Batch ID | \`${BATCH_ID}\` |"
            echo "| Source run ID | \`${{ inputs.source_run_id }}\` |"
            echo "| Snapshot ID | \`${SID}\` |"
            echo "| Update current manifest | \`${UPDATE_CURRENT_MANIFEST}\` |"
            echo "| Current ID | \`${CURRENT_ID:-'(unchanged/default)'}\` |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            if [ -n "${PR_URL:-}" ]; then
              echo ""
              echo "### Pull Request"
              echo "- ${PR_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
